			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "#!/bin/sh\nset -eu\n\n# ============================================================\n# Vulkan assets build script para Xcode\n#\n# Layout de salida:\n#\n#   ${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/assets/shaders\n#   ${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/assets/textures\n#   ${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/assets/meshes\n#\n# Desde Xcode puedes pasar:\n#   - shaders individuales en Input Files\n#   - texturas individuales en Input Files\n#   - meshes/modelos individuales en Input Files\n#   - carpetas completas en Input Files\n#\n# Variables opcionales:\n#\n#   ASSETS_OUTPUT_DIR\n#   SHADER_OUTPUT_DIR\n#   TEXTURE_OUTPUT_DIR\n#   MESH_OUTPUT_DIR\n#   SHADER_INPUT_DIR\n#   TEXTURE_INPUT_DIR\n#   MESH_INPUT_DIR\n#\n# ============================================================\n\nPATH=\"/opt/homebrew/bin:/usr/local/bin:${PATH}\"\nexport PATH\n\nlog() {\n  printf '%s\\n' \"$*\"\n}\n\nwarn() {\n  printf 'WARNING: %s\\n' \"$*\" >&2\n}\n\ndie() {\n  printf 'ERROR: %s\\n' \"$*\" >&2\n  exit 1\n}\n\ndefault_resources_dir() {\n  if [ -n \"${BUILT_PRODUCTS_DIR:-}\" ] && [ -n \"${UNLOCALIZED_RESOURCES_FOLDER_PATH:-}\" ]; then\n    printf '%s\\n' \"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\n  elif [ -n \"${BUILT_PRODUCTS_DIR:-}\" ]; then\n    printf '%s\\n' \"${BUILT_PRODUCTS_DIR}\"\n  else\n    printf '%s\\n' \"${SRCROOT:-.}/build\"\n  fi\n}\n\nRESOURCES_DIR=\"$(default_resources_dir)\"\n\nASSETS_OUTPUT_DIR=\"${ASSETS_OUTPUT_DIR:-${RESOURCES_DIR}/assets}\"\nSHADER_OUTPUT_DIR=\"${SHADER_OUTPUT_DIR:-${ASSETS_OUTPUT_DIR}/shaders}\"\nTEXTURE_OUTPUT_DIR=\"${TEXTURE_OUTPUT_DIR:-${ASSETS_OUTPUT_DIR}/textures}\"\nMESH_OUTPUT_DIR=\"${MESH_OUTPUT_DIR:-${ASSETS_OUTPUT_DIR}/meshes}\"\n\nfind_shader_compiler() {\n  if command -v glslc >/dev/null 2>&1; then\n    command -v glslc\n    return 0\n  fi\n\n  if command -v glslangValidator >/dev/null 2>&1; then\n    command -v glslangValidator\n    return 0\n  fi\n\n  if [ -n \"${VULKAN_SDK:-}\" ]; then\n    if [ -x \"${VULKAN_SDK}/bin/glslc\" ]; then\n      printf '%s\\n' \"${VULKAN_SDK}/bin/glslc\"\n      return 0\n    fi\n\n    if [ -x \"${VULKAN_SDK}/bin/glslangValidator\" ]; then\n      printf '%s\\n' \"${VULKAN_SDK}/bin/glslangValidator\"\n      return 0\n    fi\n  fi\n\n  for rel in \\\n    \"../../../libraries/vulkan/macOS/bin/glslc\" \\\n    \"../../libraries/vulkan/macOS/bin/glslc\" \\\n    \"../libraries/vulkan/macOS/bin/glslc\" \\\n    \"../../../libraries/vulkan/macOS/bin/glslangValidator\" \\\n    \"../../libraries/vulkan/macOS/bin/glslangValidator\" \\\n    \"../libraries/vulkan/macOS/bin/glslangValidator\"\n  do\n    candidate=\"${SRCROOT:-.}/${rel}\"\n    if [ -x \"$candidate\" ]; then\n      printf '%s\\n' \"$candidate\"\n      return 0\n    fi\n  done\n\n  return 1\n}\n\nis_shader_compiler_glslang() {\n  case \"$(basename \"$SHADER_COMPILER\")\" in\n    glslangValidator) return 0 ;;\n    *) return 1 ;;\n  esac\n}\n\nis_shader() {\n  case \"$1\" in\n    *.vert|*.frag|*.comp|*.geom|*.tesc|*.tese|*.glsl) return 0 ;;\n    *) return 1 ;;\n  esac\n}\n\nis_texture() {\n  case \"$1\" in\n    *.png|*.jpg|*.jpeg|*.bmp|*.tga|*.ktx|*.ktx2|*.dds|*.webp) return 0 ;;\n    *) return 1 ;;\n  esac\n}\n\nis_mesh() {\n  case \"$1\" in\n    *.obj|*.fbx|*.gltf|*.glb|*.dae|*.ply|*.stl|*.mtl|*.usd|*.usda|*.usdc|*.usdz|*.blend) return 0 ;;\n    *) return 1 ;;\n  esac\n}\n\nshader_output_name() {\n  src=\"$1\"\n  base=\"$(basename \"$src\")\"\n\n  # Para imitar tu Makefile:\n  #   shader.vert -> vert.spv\n  #   shader.frag -> frag.spv\n  #\n  # Si luego tienes otro nombre:\n  #   lighting.vert -> lighting.vert.spv\n  #   skybox.frag  -> skybox.frag.spv\n\n  case \"$base\" in\n    shader.vert) printf '%s\\n' \"vert.spv\" ;;\n    shader.frag) printf '%s\\n' \"frag.spv\" ;;\n\n    *.vert) printf '%s\\n' \"${base%.vert}.vert.spv\" ;;\n    *.frag) printf '%s\\n' \"${base%.frag}.frag.spv\" ;;\n    *.comp) printf '%s\\n' \"${base%.comp}.comp.spv\" ;;\n    *.geom) printf '%s\\n' \"${base%.geom}.geom.spv\" ;;\n    *.tesc) printf '%s\\n' \"${base%.tesc}.tesc.spv\" ;;\n    *.tese) printf '%s\\n' \"${base%.tese}.tese.spv\" ;;\n    *.glsl) printf '%s\\n' \"${base%.glsl}.spv\" ;;\n    *)      printf '%s\\n' \"${base}.spv\" ;;\n  esac\n}\n\nmesh_output_path() {\n  src=\"$1\"\n  explicit_dst=\"${2:-}\"\n\n  if [ -z \"$explicit_dst\" ]; then\n    printf '%s\\n' \"${MESH_OUTPUT_DIR}/$(basename \"$src\")\"\n    return 0\n  fi\n\n  case \"$explicit_dst\" in\n    */)\n      printf '%s\\n' \"${explicit_dst}$(basename \"$src\")\"\n      return 0\n      ;;\n  esac\n\n  if [ -d \"$explicit_dst\" ]; then\n    printf '%s\\n' \"${explicit_dst}/$(basename \"$src\")\"\n    return 0\n  fi\n\n  printf '%s\\n' \"$explicit_dst\"\n}\n\ncompile_shader() {\n  src=\"$1\"\n  dst=\"$2\"\n\n  [ -f \"$src\" ] || die \"Shader no existe: $src\"\n\n  mkdir -p \"$(dirname \"$dst\")\"\n\n  log \"Compilando shader:\"\n  log \"  SRC: $src\"\n  log \"  DST: $dst\"\n\n  if is_shader_compiler_glslang; then\n    \"$SHADER_COMPILER\" -V \"$src\" -o \"$dst\"\n  else\n    \"$SHADER_COMPILER\" \"$src\" -o \"$dst\"\n  fi\n}\n\ncopy_texture() {\n  src=\"$1\"\n  dst=\"$2\"\n\n  [ -f \"$src\" ] || die \"Textura no existe: $src\"\n\n  mkdir -p \"$(dirname \"$dst\")\"\n\n  log \"Copiando textura:\"\n  log \"  SRC: $src\"\n  log \"  DST: $dst\"\n\n  cp -f \"$src\" \"$dst\"\n}\n\ncopy_mesh() {\n  src=\"$1\"\n  dst=\"$2\"\n\n  [ -f \"$src\" ] || die \"Mesh/modelo no existe: $src\"\n\n  mkdir -p \"$(dirname \"$dst\")\"\n\n  log \"Copiando mesh/modelo:\"\n  log \"  SRC: $src\"\n  log \"  DST: $dst\"\n\n  cp -f \"$src\" \"$dst\"\n}\n\nprocess_file() {\n  src=\"$1\"\n  explicit_dst=\"${2:-}\"\n\n  [ -f \"$src\" ] || die \"Archivo no existe: $src\"\n\n  if is_shader \"$src\"; then\n    dst=\"${explicit_dst:-${SHADER_OUTPUT_DIR}/$(shader_output_name \"$src\")}\"\n    compile_shader \"$src\" \"$dst\"\n    COMPILED_COUNT=$((COMPILED_COUNT + 1))