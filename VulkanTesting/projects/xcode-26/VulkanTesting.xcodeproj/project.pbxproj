_OUTPUT_DIR\"\n\nCOMPILED_COUNT=0\nTEXTURE_COUNT=0\nMESH_COUNT=0\n\nCOUNT_IN=\"${SCRIPT_INPUT_FILE_COUNT:-0}\"\nCOUNT_OUT=\"${SCRIPT_OUTPUT_FILE_COUNT:-0}\"\n\nlog \"Xcode Input Files:  $COUNT_IN\"\nlog \"Xcode Output Files: $COUNT_OUT\"\n\nif [ \"$COUNT_IN\" -gt 0 ]; then\n  i=0\n\n  while [ \"$i\" -lt \"$COUNT_IN\" ]; do\n    eval src=\"\\${SCRIPT_INPUT_FILE_${i}}\"\n\n    explicit_dst=\"\"\n\n    if [ \"$i\" -lt \"$COUNT_OUT\" ]; then\n      eval explicit_dst=\"\\${SCRIPT_OUTPUT_FILE_${i}}\"\n    fi\n\n    if [ -d \"$src\" ]; then\n      if [ -n \"$explicit_dst\" ]; then\n        warn \"Input #$i es carpeta. Se ignora su Output File explícito: $explicit_dst\"\n      fi\n\n      process_dir \"$src\"\n    else\n      process_file \"$src\" \"$explicit_dst\"\n    fi\n\n    i=$((i + 1))\n  done\nelse\n  did_something=0\n\n  if [ -n \"${SHADER_INPUT_DIR:-}\" ]; then\n    process_dir \"$SHADER_INPUT_DIR\"\n    did_something=1\n  fi\n\n  if [ -n \"${TEXTURE_INPUT_DIR:-}\" ]; then\n    process_dir \"$TEXTURE_INPUT_DIR\"\n    did_something=1\n  fi\n\n  if [ -n \"${MESH_INPUT_DIR:-}\" ]; then\n    process_dir \"$MESH_INPUT_DIR\"\n    did_something=1\n  fi\n\n  if [ \"$did_something\" -eq 0 ]; then\n    die \"No hay Input Files ni SHADER_INPUT_DIR / TEXTURE_INPUT_DIR / MESH_INPUT_DIR configurados.\"\n  fi\nfi\n\nlog \"OK:\"\nlog \"  Shaders compilados: $COMPILED_COUNT\"\nlog \"  Texturas copiadas:  $TEXTURE_COUNT\"\nlog \"  Meshes/modelos copiados: $MESH_COUNT\"\n";
